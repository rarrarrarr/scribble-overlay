<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>scribble overlay: local test</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 24px; background: #222; color: #ddd; }
  .player { position: relative; max-width: 1100px; margin-top: 12px; background: #000; }
  video { display: block; width: 100%; }
</style>
</head>
<body>
<label>Video file: <input type="file" accept="video/*"></label>
<span style="opacity:.6">— press Alt+S to toggle the sketch</span>
<div class="player"><video controls muted playsinline></video></div>

<!-- the same file Tampermonkey installs -->
<script src="scribble-overlay.user.js"></script>
<script>
  const video = document.querySelector('video');
  // A file picked here gets a blob: URL, so its frames are readable. (Opening a
  // video by file:// path would make it cross-origin and block reading.)
  document.querySelector('input').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (!f) return;
    video.src = URL.createObjectURL(f);
    video.addEventListener('loadeddata', () => window.scribbleOverlay.enable(video), { once: true });
  });
  // ?src=clip.mp4 loads a same-origin video directly (used for automated checks)
  const src = new URLSearchParams(location.search).get('src');
  if (src) video.src = src;
</script>
</body>
</html>
